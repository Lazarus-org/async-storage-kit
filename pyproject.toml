[build-system]
build-backend = "uv_build"
requires = [ "uv-build==0.13.6" ]

[project]
name = "async-storage-kit"
version = "1.0.0"
description = """\
  Async file storage with filesystem, S3-compatible, and in-memory backends\
  """
readme = "README.md"
keywords = [ "asyncio", "filesystem", "s3", "storage", "streaming" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Aryan Niknezhad", email = "aryan513966@gmail.com" },
  { name = "Mehrshad Mirshekary", email = "mehrshad_mirshekary@email.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
optional-dependencies.fastapi = [ "fastapi>=0.115,<1" ]
# Contributor extras intentionally support pip and Tox users without uv.
optional-dependencies.quality = [
  "bandit[toml]>=1.9.4,<2",
  "commitizen>=4.19.3,<5",
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pyproject-fmt>=2.30.3,<3",
  "ruff==0.17.4",
  "tox>=4.67.1,<5",
  "tox-ini-fmt>=1.10,<2",
  "tox-uv>=1.37,<2",
  "twine>=7,<8",
]
optional-dependencies.s3 = [ "aioboto3>=15,<16" ]
optional-dependencies.test = [
  "aioboto3>=15,<16",
  "aiohttp>=3.9,<4",
  "django>=5.2,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7.1,<8",
]
urls.Changelog = """\
  https://github.com/Lazarus-org/async-storage-kit/blob/main/CHANGELOG.md\
  """
urls.Documentation = "https://github.com/Lazarus-org/async-storage-kit#readme"
urls.Issues = "https://github.com/Lazarus-org/async-storage-kit/issues"
urls.Repository = "https://github.com/Lazarus-org/async-storage-kit"

[dependency-groups]
# Default uv setup; keep aligned with the extras used by tox and archive validation.
dev = [
  "aioboto3>=15,<16",
  "aiohttp>=3.9,<4",
  "bandit[toml]>=1.9.4,<2",
  "commitizen>=4.19.3,<5",
  "django>=5.2,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pyproject-fmt>=2.30.3,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7.1,<8",
  "ruff==0.17.4",
  "tox>=4.67.1,<5",
  "tox-ini-fmt>=1.10,<2",
  "tox-uv>=1.37,<2",
  "twine>=7,<8",
]

[tool.uv]
required-version = ">=0.13.6"
build-backend.module-name = "async_storage_kit"
build-backend.module-root = "src"
build-backend.source-exclude = [
  "docs/history/**",
  ".git",
  ".idea",
  ".venv",
  ".release-venv",
  ".venv-dev",
  ".uv",
  ".tox",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "build",
  "dist",
  "*.pyc",
  "*.pyo",
  "*.zip",
  ".DS_Store",
  ".env",
  ".env.*",
]
build-backend.source-include = [
  "AUTHORS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CONTRIBUTORS.md",
  "CODE_OF_CONDUCT.md",
  "uv.lock",
  "tox.ini",
  ".pre-commit-config.yaml",
  ".gitignore",
  ".gitattributes",
  "tests/**/*.py",
  "examples/**/*.py",
  "examples/**/*.md",
  "docs/**/*.md",
  ".github/scripts/*.py",
  ".github/workflows/*.yml",
  ".github/workflows/*.yaml",
  ".github/dependabot.yml",
]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"
line-length = 88
lint.select = [ "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM" ]

[tool.pyproject-fmt]
column_width = 88
keep_full_version = true
generate_python_version_classifiers = false

[tool.bandit]
targets = [ "src/async_storage_kit" ]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [ "aioboto3", "aioboto3.*", "botocore", "botocore.*" ]
ignore_missing_imports = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra --strict-config --strict-markers"
ini_options.markers = [
  "live_s3: requires a disposable S3-compatible endpoint and credentials"
]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "strict"

[tool.coverage]
run.source = [ "async_storage_kit" ]
run.branch = true
run.relative_files = true
run.patch = [ "subprocess" ]
paths.source = [ "src/async_storage_kit", "*/site-packages/async_storage_kit" ]
# Native runs cannot execute every platform's filesystem implementation.
# CI combines the platform matrix and enforces 100% in its coverage job.
report.fail_under = 85
report.precision = 2
report.skip_covered = true
report.show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = [ "src/async_storage_kit/__init__.py:__version__" ]
tag_format = "v$version"
